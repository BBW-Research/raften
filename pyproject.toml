[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "raften"
dynamic = ["version"]
description = "Policy checks for code and documentation in agentic coding projects."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
dependencies = []
authors = [
  {name = "Raften contributors"},
]
keywords = ["coding-agents", "documentation", "policy", "repository", "static-analysis"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
raften = "raften.cli:main"

[project.urls]
Homepage = "https://github.com/BBW-Research/repo-context"
Issues = "https://github.com/BBW-Research/repo-context/issues"
Repository = "https://github.com/BBW-Research/repo-context"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "raften.__version__"}
