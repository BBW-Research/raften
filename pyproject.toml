[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-context-policy"
dynamic = ["version"]
description = "Repository context budgets, documentation reachability, and policy ratchets for coding-agent projects."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = []
authors = [
  {name = "Repo Context contributors"},
]
keywords = ["coding-agents", "documentation", "policy", "repository", "static-analysis"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
repo-context = "repo_context.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "repo_context.__version__"}
