[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-context"
dynamic = ["version"]
description = "Repository context budgets, documentation reachability, and policy ratchets for coding-agent projects."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
repo-context = "repo_context.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "repo_context.__version__"}
